<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodSync | Judge Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<a class="logo login-logo" href="index.html">🍃 FoodSync</a>

<div class="login-card">
    <div class="login-icon">🌿</div>
    <span class="tag">WELCOME TO FOODSYNC</span>
    <h1>Judge Login</h1>
    <p>Sign in to explore the smart food dashboard.</p>

    <form onsubmit="login(event)">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>

        <label>Password</label>
        <div class="password-box">
            <input type="password" id="password" placeholder="Enter password" required>
            <button type="button" class="show-btn" onclick="togglePassword()">Show</button>
        </div>

        <p id="loginMessage" class="message"></p>
        <button class="btn login-btn" type="submit">Login to Dashboard →</button>
    </form>

    <div class="demo-credentials">
        <strong>Demo credentials</strong>
        <p>Username: <b>judge</b></p>
        <p>Password: <b>FoodSync@123</b></p>
    </div>

    <a class="back-link" href="index.html">← Back to Home</a>
</div>

<script src="script.js"></script>
</body>
</html>
